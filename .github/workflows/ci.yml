name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify backend folder exists
        run: |
          test -f backend/requirements.txt || (echo "::error::backend/requirements.txt missing — backend may be a broken git submodule. Run scripts/fix-backend-on-github.ps1" && exit 1)
          test -d backend/app || (echo "::error::backend/app missing" && exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint (syntax check)
        working-directory: backend
        run: python -m compileall app
      - name: Import check
        working-directory: backend
        env:
          GEMINI_API_KEY: test-key
          SECRET_KEY: ci-secret-key-for-testing-only
        run: python -c "from app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install & build
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: http://localhost:8000/api

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t resume-analyzer-backend ./backend
      - name: Build frontend image
        run: docker build -t resume-analyzer-frontend ./frontend
